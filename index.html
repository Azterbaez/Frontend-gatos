<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Gato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #960b35 0%, #d8e707 100%);
      min-height: 100vh;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .gato-card {
      transition: transform0.2s ease, box-shadow 0.2s ease;
    }

    .gato-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }


    .gato-img {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }


    #resultado {
      display: none;
    }

    #preview {
      max-width: 100%;
      max-height: 180px;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #6c757d;
    }
  </style>
</head>

<body>

  <div class="container-fluid py-4 px-3 px-md-4">

    <body class="row g-4">

      <!-- ======= FORMULARIO A LA IZQUIERDA ======= -->
      <div class="col-12 col-lg-4">

        <div class="card p-4">
          <h2 class="text-center mb-4">Registro de Gato</h2>

          <form id="formGato">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
            </div>

            <div class="mb-3">
              <label class="form-label">Edad (años)</label>
              <input type="number" class="form-control" id="edad" required min="0" step="0.1" placeholder="Ej: 2.5">
            </div>

            <div class="mb-3">
              <label class="form-label">Peso (kg)</label>
              <input type="number" class="form-control" id="peso" required min="0" step="0.1" placeholder="Ej: 4.2">
            </div>

            <div class="mb-3">
              <label class="form-label">Raza</label>
              <input type="text" class="form-control" id="raza" required placeholder="Ej: Siamés">
            </div>

            <div class="mb-3">
              <label class="form-label">Propietario</label>
              <input type="text" class="form-control" id="propietario" required placeholder="Ej: Elgin">
            </div>
            <div class="mb-3">
              <label class="form-label">Imagen del gato</label>
              <input type="file" class="form-control" id="imagen" accept="image/*">
              <img id="preview" alt="Vista previa de la imagen">
              <small class="text-muted" id="AyudaImagen">
                Al editar, si no selecciona una nueva imagen se mantiene la actual
              </small>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnSubmit">
              Registrar Gato
            </button>
            <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btnCancelar">
              Cancelar Edicion
            </button>
          </form>


          <!-- Mensaje del backend -->
          <div id="resultado" class="alert mt-4" role="alert">
          </div>

        </div>

        <!-- ======= Tarjeta de Gato (derecha) ======= -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
  <h2 class="mb-0">Gatos Registrados</h2>
   <div class="d-flex gap-2 flex-grow-1 flex-md-grow-0" style="max-width: 450px;">
    <input type="search" class="form-control form-control-sm" id="inputBusqueda"
      placeholder="Buscar por nombre, raza, edad, peso o fecha...">
    <button class="btn btn-outline-secondary btn-sm" id="btnRecargar" title="Mostrar todos">
      Actualizar
    </button>
  </div>
</div>


          <div id="listaGatos" class="row g-3">
            <div class="col-12 loading">
              Cargando gatos...
            </div>

          </div>
        </div>
      </div>

      <script>
        // =====================================================
    // CONFIGURACIÓN DEL BACKEND
    // =====================================================

    const BACKEND_URL = 'https://backend-gatos-y8fx.onrender.com';

    // ========== Búsqueda de gatos ==========
async function buscarGatos() {
  const termino = document.getElementById("inputBusqueda").value.trim();
  const contenedor = document.getElementById("listaGatos");

  if (!termino) {
    // Si el campo está vacío, mostramos todos
    cargarGatos();
    return;
  }

  contenedor.innerHTML = `<div class="col-12 loading">Buscando...</div>`;

  try {
    const respuesta = await fetch(
      `${BACKEND_URL}/gatos/buscar?q=${encodeURIComponent(termino)}`
    );
    const gatos = await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(gatos.mensaje || "Error al buscar");
    }

    if (gatos.length === 0) {
        contenedor.innerHTML = `
    <div class="col-12">
      <div class="alert alert-warning text-center">
        No se encontraron gatos que coincidan con "<strong>${termino}</strong>".
      </div>
    </div>`;
      return;
    }

    // Reutilizamos exactamente la misma lógica de renderizado
    contenedor.innerHTML = gatos.map(gato => `
  <div class="col-12 col-sm-6 col-xl-4">
    <div class="card gato-card h-100">
      <img src="${gato.imagenUrl}" class="card-img-top gato-img" alt="${gato.nombre}"
          onerror="this.src='https://placehold.co/400x300?text=Sin+imagen'">
      <div class="card-body d-flex flex-column">
        <h5 class="card-title mb-1">${gato.nombre}</h5>
        <p class="card-text mb-1">
          <small class="text-muted">
            ${gato.raza} · ${gato.edad} años · ${gato.peso} kg
          </small>
        </p>
        <p class="card-text">
          <small class="text-muted">
            Registrado: ${new Date(gato.fecha).toLocaleDateString('es-ES')}
          </small>
        </p>
        <div class="mt-auto d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary flex-fill" 
                  onclick='editarGato(${JSON.stringify(gato)})'>
            Actualizar
          </button>
          <button class="btn btn-sm btn-outline-danger flex-fill" 
                  onclick="eliminarGato('${gato.id}', '${gato.nombre}')">
            Eliminar
          </button>
        </div>
      </div>
    </div>
 </div>
`).join("");

  } catch (error) {
    console.error(error);
    contenedor.innerHTML = `
  <div class="col-12">
    <div class="alert alert-danger text-center">
      Error al realizar la búsqueda. Intenta de nuevo.
    </div>
  </div>`;
  }
}

// Eventos de búsqueda

document.getElementById("inputBusqueda").addEventListener("input", () => {
  buscarGatos(); // busca automáticamente al escribir 
});

document.getElementById("inputBusqueda").addEventListener("keyup", (e) => {
  if (e.key === "Enter") {
    buscarGatos();
  }
});

// Botón de recargar
document.getElementById("btnRecargar").addEventListener("click", cargarGatos);

    

    // =====================================================
    // ELEMENTOS DEL DOM
    // =====================================================

    const formGato = document.getElementById("formGato");
    const resultadoDiv = document.getElementById("resultado");
    const listaGatos = document.getElementById("listaGatos");
    const imagenInput = document.getElementById("imagen");
    const preview = document.getElementById("preview");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnCancelar = document.getElementById("btnCancelar");
    const btnRecargar = document.getElementById("btnRecargar");


    // =====================================================
    // VARIABLE PARA SABER SI ESTAMOS EDITANDO
    // =====================================================

    let gatoEditandoId = null;


    // =====================================================
    // VISTA PREVIA DE IMAGEN
    // =====================================================

    imagenInput.addEventListener("change", (e) => {

        const file = e.target.files[0];

        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        } else {
            preview.src = "";
            preview.style.display = "none";
        }

    });


    // =====================================================
    // REGISTRAR / ACTUALIZAR GATO
    // =====================================================

    formGato.addEventListener("submit", async (e) => {

        e.preventDefault();

        resultadoDiv.style.display = "none";

        const formData = new FormData();

        // Datos del formulario
        formData.append(
            "nombre",
            document.getElementById("nombre").value.trim()
        );

        formData.append(
            "edad",
            document.getElementById("edad").value
        );

        formData.append(
            "peso",
            document.getElementById("peso").value
        );

        formData.append(
            "raza",
            document.getElementById("raza").value.trim()
        );

        formData.append(
            "propietario",
            document.getElementById("propietario").value.trim()
        );


        // Imagen
        if (imagenInput.files.length > 0) {
            formData.append(
                "imagen",
                imagenInput.files[0]
            );
        }


        try {

            let url;
            let metodo;


            // -------------------------------------------------
            // EDITAR
            // -------------------------------------------------

            if (gatoEditandoId) {

                url = `${BACKEND_URL}/gato/${gatoEditandoId}`;
                metodo = "PUT";

            }

            // -------------------------------------------------
            // REGISTRAR
            // -------------------------------------------------

            else {

                url = `${BACKEND_URL}/gato`;
                metodo = "POST";

            }


            console.log("Enviando petición:", metodo, url);


            const respuesta = await fetch(url, {
                method: metodo,
                body: formData
            });


            // Intentamos leer la respuesta
            const data = await respuesta.json();


            // Si el backend devuelve error
            if (!respuesta.ok) {

                throw new Error(
                    data.mensaje ||
                    data.message ||
                    "Error al procesar el gato"
                );

            }


            // -------------------------------------------------
            // MENSAJE DE ÉXITO
            // -------------------------------------------------

            resultadoDiv.className =
                "alert alert-success mt-4";

            resultadoDiv.textContent =
                data.mensaje ||
                (
                    gatoEditandoId
                        ? "Gato actualizado correctamente."
                        : "Gato registrado correctamente."
                );

            resultadoDiv.style.display = "block";


            // -------------------------------------------------
            // LIMPIAR FORMULARIO
            // -------------------------------------------------

            limpiarFormulario();


            // -------------------------------------------------
            // RECARGAR LISTA
            // -------------------------------------------------

            await cargarGatos();


        } catch (error) {

            console.error(
                "Error al guardar gato:",
                error
            );


            resultadoDiv.className =
                "alert alert-danger mt-4";

            resultadoDiv.textContent =
                error.message ||
                "Error de conexión con el servidor.";

            resultadoDiv.style.display = "block";

        }

    });


    // =====================================================
    // CARGAR GATOS
    // =====================================================

    async function cargarGatos() {

        listaGatos.innerHTML = `
            <div class="col-12 text-center p-4">
                <div class="spinner-border text-primary"
                     role="status">

                    <span class="visually-hidden">
                        Cargando gatos...
                    </span>

                </div>

                <p class="mt-2">
                    Cargando gatos...
                </p>
            </div>
        `;


        try {

            // IMPORTANTE:
            // GET /gatos
            const respuesta =
                await fetch(`${BACKEND_URL}/gatos`);


            const datos =
                await respuesta.json();


            console.log(
                "Respuesta del servidor:",
                datos
            );


            if (!respuesta.ok) {

                throw new Error(
                    datos.mensaje ||
                    datos.message ||
                    "Error al obtener gatos"
                );

            }


            // -------------------------------------------------
            // NO HAY GATOS
            // -------------------------------------------------

            if (!Array.isArray(datos) || datos.length === 0) {

                listaGatos.innerHTML = `
                    <div class="col-12">

                        <div class="alert alert-info text-center">

                            Aún no hay gatos registrados.

                        </div>

                    </div>
                `;

                return;
            }


            // -------------------------------------------------
            // MOSTRAR GATOS
            // -------------------------------------------------

            listaGatos.innerHTML = datos.map(gato => {

                // Imagen
                const imagen =
                    gato.imagenUrl ||
                    gato.foto ||
                    "https://placehold.co/400x300?text=Sin+imagen";


                // Fecha
                let fecha = "Sin fecha";

                if (gato.fecha) {

                    fecha =
                        new Date(gato.fecha)
                            .toLocaleDateString("es-ES");

                }


                return `

                    <div class="col-md-4 col-sm-6 mb-4">

                        <div class="card gato-card h-100">

                            <img
                                src="${imagen}"
                                class="card-img-top gato-img"
                                alt="${gato.nombre || "Gato"}"
                                onerror="
                                    this.src='https://placehold.co/400x300?text=Sin+imagen'
                                "
                            >

                            <div class="card-body d-flex flex-column">

                                <h5 class="card-title">
                                    ${gato.nombre || "Sin nombre"}
                                </h5>


                                <p class="card-text text-muted">

                                    <strong>Raza:</strong>
                                    ${gato.raza || "No especificada"}

                                    <br>

                                    <strong>Edad:</strong>
                                    ${gato.edad ?? "N/A"} años

                                    <br>

                                    <strong>Peso:</strong>
                                    ${gato.peso ?? "N/A"} kg

                                    <br>

                                    <strong>Propietario:</strong>
                                    ${gato.propietario || "No especificado"}

                                </p>


                                <p class="small text-muted">

                                    Registrado:
                                    ${fecha}

                                </p>


                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary mt-auto"
                                    onclick='editarGato(${JSON.stringify(gato)})'
                                >

                                    Actualizar

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }).join("");


        } catch (error) {

            console.error(
                "Error al cargar gatos:",
                error
            );


            listaGatos.innerHTML = `

                <div class="col-12">

                    <div class="alert alert-danger text-center">

                        <strong>
                            Error al cargar los gatos
                        </strong>

                        <br>

                        <small>
                            ${error.message}
                        </small>

                        <br><br>

                        <button
                            class="btn btn-sm btn-danger"
                            onclick="cargarGatos()"
                        >
                            Intentar nuevamente
                        </button>

                    </div>

                </div>

            `;

        }

    }


    // =====================================================
    // EDITAR GATO
    // =====================================================

    function editarGato(gato) {

        console.log(
            "Editando gato:",
            gato
        );


        // Guardar ID
        gatoEditandoId =
            gato.id ||
            gato._id;


        // Cargar datos
        document.getElementById("nombre").value =
            gato.nombre || "";


        document.getElementById("edad").value =
            gato.edad ?? "";


        document.getElementById("peso").value =
            gato.peso ?? "";


        document.getElementById("raza").value =
            gato.raza || "";


        document.getElementById("propietario").value =
            gato.propietario || "";


        // -------------------------------------------------
        // Mostrar imagen actual
        // -------------------------------------------------

        const imagenActual =
            gato.imagenUrl ||
            gato.foto;


        if (imagenActual) {

            preview.src = imagenActual;
            preview.style.display = "block";

        } else {

            preview.src = "";
            preview.style.display = "none";

        }


        // -------------------------------------------------
        // Cambiar botón
        // -------------------------------------------------

        btnSubmit.textContent =
            "Actualizar Gato";


        btnCancelar.classList.remove(
            "d-none"
        );


        // -------------------------------------------------
        // Ir al formulario
        // -------------------------------------------------

        formGato.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    // =====================================================
    // LIMPIAR FORMULARIO
    // =====================================================

    function limpiarFormulario() {

        formGato.reset();

        gatoEditandoId = null;

        preview.src = "";
        preview.style.display = "none";

        btnSubmit.textContent =
            "Registrar Gato";

        btnCancelar.classList.add(
            "d-none"
        );

    }


    // =====================================================
    // CANCELAR EDICIÓN
    // =====================================================

    btnCancelar.addEventListener(
        "click",
        () => {

            limpiarFormulario();

            resultadoDiv.style.display =
                "none";

        }
    );


    // =====================================================
    // BOTÓN ACTUALIZAR LISTA
    // =====================================================

    btnRecargar.addEventListener(
        "click",
        cargarGatos
    );


    // =====================================================
    // CARGAR GATOS AL ABRIR LA PÁGINA
    // =====================================================

    cargarGatos();

      </script>

    </body>

</html>
