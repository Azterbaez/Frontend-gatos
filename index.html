<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Gato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #960b35 0%, #d8e707 100%);
      min-height: 100vh;
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .gato-card {
      transition: transform0.2s ease, box-shadow 0.2s ease;
    }

    .gato-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }


    .gato-img {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
    }


    #resultado {
      display: none;
    }

    #preview {
      max-width: 100%;
      max-height: 180px;
      margin-top: 10px;
      border-radius: 8px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #6c757d;
    }
  </style>
</head>

<body>

  <div class="container-fluid py-4 px-3 px-md-4">

    <body class="row g-4">

      <!-- ======= FORMULARIO A LA IZQUIERDA ======= -->
      <div class="col-12 col-lg-4">

        <div class="card p-4">
          <h2 class="text-center mb-4">Registro de Gato</h2>

          <form id="formGato">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" required placeholder="Ej: Michi">
            </div>

            <div class="mb-3">
              <label class="form-label">Edad (años)</label>
              <input type="number" class="form-control" id="edad" required min="0" step="0.1" placeholder="Ej: 2.5">
            </div>

            <div class="mb-3">
              <label class="form-label">Peso (kg)</label>
              <input type="number" class="form-control" id="peso" required min="0" step="0.1" placeholder="Ej: 4.2">
            </div>

            <div class="mb-3">
              <label class="form-label">Raza</label>
              <input type="text" class="form-control" id="raza" required placeholder="Ej: Siamés">
            </div>

            <div class="mb-3">
              <label class="form-label">Propietario</label>
              <input type="text" class="form-control" id="propietario" required placeholder="Ej: Elgin">
            </div>
            <div class="mb-3">
              <label class="form-label">Imagen del gato</label>
              <input type="file" class="form-control" id="imagen" accept="image/*">
              <img id="preview" alt="Vista previa de la imagen">
              <small class="text-muted" id="AyudaImagen">
                Al editar, si no selecciona una nueva imagen se mantiene la actual
              </small>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnSubmit">
              Registrar Gato
            </button>
            <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="btnCancelar">
              Cancelar Edicion
            </button>
          </form>


          <!-- Mensaje del backend -->
          <div id="resultado" class="alert mt-4" role="alert">
          </div>

        </div>

        <!-- ======= Tarjeta de Gato (derecha) ======= -->
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Gatos Registrados</h2>
            <button class="btn btn-outline-secondary btn-sm" id="btnRecargar">
              Actualizar
            </button>
          </div>
          <div id="listaGatos" class="row g-3">
            <div class="col-12 loading">
              Cargando gatos...
            </div>

          </div>
        </div>
      </div>

      <script>
        const BACKEND_URL = 'https://backend-gatos-y8fx.onrender.com/gato';

// Vista previa de imagen
document.getElementById("imagen").addEventListener("change", (e) => {
    const preview = document.getElementById("preview");
    const file = e.target.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    } else {
        preview.src = "";
        preview.style.display = "none";
    }
});


// Registrar gato
document.getElementById("formGato").addEventListener("submit", async (e) => {
    e.preventDefault();

    const resultadoDiv = document.getElementById("resultado");
    resultadoDiv.style.display = "none";

    const formData = new FormData();

    formData.append(
        "nombre",
        document.getElementById("nombre").value.trim()
    );

    formData.append(
        "edad",
        document.getElementById("edad").value
    );

    formData.append(
        "peso",
        document.getElementById("peso").value
    );

    formData.append(
        "raza",
        document.getElementById("raza").value.trim()
    );

    formData.append(
        "propietario",
        document.getElementById("propietario").value.trim()
    );

    const imagenInput = document.getElementById("imagen");

    if (imagenInput.files.length > 0) {
        formData.append("imagen", imagenInput.files[0]);
    }

    try {
        const respuesta = await fetch(`${BACKEND_URL}/gatos`, {
            method: "POST",
            body: formData
        });

        const data = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(data.mensaje || "Error al registrar el gato");
        }

        resultadoDiv.className = "alert alert-success mt-4";
        resultadoDiv.textContent = data.mensaje || "Gato registrado correctamente";
        resultadoDiv.style.display = "block";

        document.getElementById("formGato").reset();
        document.getElementById("preview").style.display = "none";

        cargarGatos();

    } catch (error) {
        console.error(error);

        resultadoDiv.className = "alert alert-danger mt-4";
        resultadoDiv.textContent = error.message;
        resultadoDiv.style.display = "block";
    }
});


// Cargar gatos
async function cargarGatos() {

    const contenedor = document.getElementById("listaGatos");

    contenedor.innerHTML = `
        <div class="col-12 text-center p-3">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>
    `;

    try {

        const respuesta = await fetch(`${BACKEND_URL}/gatos`);

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(
                datos.mensaje || datos.message || "Error al obtener gatos"
            );
        }

        if (datos.length === 0) {

            contenedor.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-info text-center">
                        Aún no hay gatos registrados.
                    </div>
                </div>
            `;

            return;
        }

        contenedor.innerHTML = datos.map(gato => `
            <div class="col-md-4 col-sm-6 mb-4">

                <div class="card gato-card h-100">

                    <img
                        src="${gato.imagenUrl || gato.foto || 'assets/img/gato-default.jpg'}"
                        class="card-img-top gato-img"
                        alt="${gato.nombre}"
                        onerror="this.src='https://placehold.co/400x300?text=Sin+imagen'"
                    >

                    <div class="card-body d-flex flex-column">

                        <h5 class="card-title">
                            ${gato.nombre}
                        </h5>

                        <p class="card-text text-muted">
                            ${gato.raza} •
                            ${gato.edad} años •
                            ${gato.peso} kg
                        </p>

                        <p class="small text-muted">
                            Registrado:
                            ${new Date(gato.fecha).toLocaleDateString("es-ES")}
                        </p>

                        <button
                            class="btn btn-sm btn-outline-primary mt-auto"
                            onclick='editarGato(${JSON.stringify(gato)})'
                        >
                            Actualizar
                        </button>

                    </div>

                </div>

            </div>
        `).join("");

    } catch (error) {

        console.error("Error al cargar gatos:", error);

        contenedor.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger text-center">
                    Error al cargar los gatos.
                    <br>
                    <small>${error.message}</small>
                </div>
            </div>
        `;
    }
}


// Editar gato
function editarGato(gato) {

    document.getElementById("nombre").value = gato.nombre;
    document.getElementById("edad").value = gato.edad;
    document.getElementById("peso").value = gato.peso;
    document.getElementById("raza").value = gato.raza;
    document.getElementById("propietario").value = gato.propietario || "";

    document.getElementById("preview").style.display = "none";

    document.getElementById("btnCancelar")
        .classList.remove("d-none");

    document.querySelector(".card")
        .scrollIntoView({ behavior: "smooth" });
}


// Limpiar formulario
function limpiarFormulario() {

    document.getElementById("formGato").reset();

    document.getElementById("preview").style.display = "none";

    document.getElementById("btnCancelar")
        .classList.add("d-none");
}


// Cancelar edición
document.getElementById("btnCancelar")
    .addEventListener("click", limpiarFormulario);


// Recargar
document.getElementById("btnRecargar")
    .addEventListener("click", cargarGatos);


// Cargar al iniciar
cargarGatos();

      </script>

    </body>

</html>
